name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff check app tests scripts
      - run: uv run pytest -q

  backend-postgres:
    # Same suite against real Postgres (migrations, JSONB, advisory lock).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: viamensa, POSTGRES_PASSWORD: viamensa, POSTGRES_DB: viamensa}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U viamensa" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      VIAMENSA_TEST_DATABASE_URL: postgresql+psycopg://viamensa:viamensa@localhost:5432/viamensa
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run pytest -q tests/test_api.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t viamensa-api backend
      - run: docker build -t viamensa-web -f Dockerfile.web .
