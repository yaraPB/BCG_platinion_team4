<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HarvestLink · NGO farmer & community platform (mock)</title>
<style>
/* ---------- design tokens (reference data-viz palette, light) ---------- */
:root{
  color-scheme:light;
  --page:#f9f9f7; --surface:#fcfcfb; --surface-2:#f3f2ee;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,.10);
  --accent:#2a78d6; --accent-hover:#256abf; --accent-soft:#cde2fb;
  --meter-track:#cde2fb; --meter-fill:#2a78d6;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s-other:#a9a8a1;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b; --good-text:#006300;
  --radius:10px; --shadow:0 1px 2px rgba(11,11,11,.04);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232322;
  --ink:#f0efec; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
  --accent:#3987e5; --accent-hover:#5598e7; --accent-soft:#184f95;
  --meter-track:#184f95; --meter-fill:#5598e7;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s-other:#6b6a66;
  --good-text:#0ca30c;
}

/* ---------- base ---------- */
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--accent)} button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:22px;margin:0 0 4px;font-weight:600} h2{font-size:18px;margin:0 0 4px;font-weight:600} h3{font-size:15px;margin:0;font-weight:600}
p{margin:0} .sub{color:var(--ink-2)} .muted{color:var(--muted)} .small{font-size:13px}
.num{font-variant-numeric:tabular-nums;text-align:right}
[hidden]{display:none !important}

/* ---------- app bar ---------- */
.appbar{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:10px 20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.logo{width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:15px}
.roles{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:999px}
.roles button{border:0;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--ink-2)}
.roles button[aria-current="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.spacer{flex:1}
.userchip{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:13px}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--ink-2)}

.container{max-width:1200px;margin:0 auto;padding:20px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}

/* ---------- cards, buttons, forms ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.card + .card{margin-top:16px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.btn{border:1px solid var(--border);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--accent);color:#fff;border-color:transparent} .btn-primary:hover{background:var(--accent-hover)}
.btn-ghost{background:transparent} .btn-sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;color:var(--ink-2)}
.input{border:1px solid var(--baseline);border-radius:8px;padding:8px 10px;background:var(--surface);width:100%}
.input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
textarea.input{min-height:72px;resize:vertical}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.form-grid .span2{grid-column:span 2}
.check{display:flex;align-items:center;gap:8px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--baseline);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.help{font-size:12px;color:var(--muted)}
.map{height:140px;border:1px solid var(--grid);border-radius:8px;background:
  repeating-linear-gradient(0deg,transparent 0 23px,var(--grid) 23px 24px),
  repeating-linear-gradient(90deg,transparent 0 23px,var(--grid) 23px 24px),var(--surface-2);
  position:relative;display:grid;place-items:center;color:var(--ink-2);font-size:13px}
.map .pin{position:absolute;left:74%;top:30%;width:14px;height:14px;border-radius:50% 50% 50% 0;background:var(--accent);transform:rotate(-45deg);box-shadow:0 0 0 2px var(--surface)}

/* ---------- layouts ---------- */
.two-col{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid-2 .card + .card{margin-top:0}
.kpis{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:14px;margin-bottom:16px}
.kpis .card{margin:0}
.stat .label{color:var(--ink-2);font-size:13px}
.stat .value{font-size:28px;font-weight:600;line-height:1.1;margin:6px 0 4px}
.stat.hero .value{font-size:48px}
.stat .delta{font-size:13px;color:var(--ink-2)}
.delta-good{color:var(--good-text)} .delta-bad{color:var(--critical)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filters .field{flex-direction:row;align-items:center;gap:8px}
.filters select{width:auto;min-width:150px}
.subnav{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px}
.subnav a{padding:8px 12px;text-decoration:none;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.subnav a[aria-current="page"]{color:var(--ink);border-color:var(--accent);font-weight:600}

/* stepper */
.stepper{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.stepper a{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;padding:10px 10px;border-radius:8px;text-decoration:none;color:var(--ink-2)}
.stepper a:hover{background:var(--surface-2)}
.stepper a[aria-current="step"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);border:1px solid var(--border)}
.stepper .n{width:26px;height:26px;border-radius:50%;border:1px solid var(--baseline);display:grid;place-items:center;font-size:12px;font-weight:600}
.stepper a[aria-current="step"] .n{background:var(--accent);border-color:transparent;color:#fff}
.stepper .done .n{background:var(--good);border-color:transparent;color:#fff}
.stepper .t{font-size:13px;font-weight:600} .stepper .d{font-size:12px;color:var(--muted)}

/* ---------- chart primitives ---------- */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;list-style:none;padding:0;margin:4px 0 14px;color:var(--ink-2);font-size:13px}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.hbars{display:grid;gap:10px}
.hbar-row{display:grid;grid-template-columns:110px minmax(0,1fr) 70px;align-items:center;gap:10px}
.hbar-label{color:var(--ink-2);font-size:13px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar{display:flex;height:20px;min-width:0}
.seg{min-width:2px;margin-right:2px;cursor:default;outline-offset:2px}
.seg:last-child{margin-right:0;border-radius:0 4px 4px 0}
.seg:hover,.seg:focus-visible{filter:brightness(1.1)}
.hbar-val{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:13px}
.meter{height:8px;border-radius:4px;background:var(--meter-track);overflow:hidden;min-width:60px}
.meter-fill{height:100%;background:var(--meter-fill);border-radius:0 4px 4px 0}
.meter-row{display:grid;grid-template-columns:110px minmax(0,1fr) 56px auto;align-items:center;gap:10px}
.meter-row .hbar-label{text-align:right}
.meters{display:grid;gap:12px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.badge-dot{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;line-height:1}
.badge-good .badge-dot{background:var(--good)} .badge-warning .badge-dot{background:var(--warning);color:#0b0b0b}
.badge-serious .badge-dot{background:var(--serious);color:#0b0b0b} .badge-critical .badge-dot{background:var(--critical)}
.badge-neutral .badge-dot{background:var(--baseline);color:var(--ink)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--muted);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--grid);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--grid);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl th.num{text-align:right}
.tbl-wrap{overflow-x:auto}
.chart-card .table-body{display:none}
.chart-card.show-table .table-body{display:block}
.chart-card.show-table .chart-body,.chart-card.show-table .legend{display:none}
.swatch{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:8px;vertical-align:-1px}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--page);padding:8px 10px;border-radius:8px;font-size:12px;max-width:260px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#tip .tip-title{color:var(--baseline);margin-bottom:4px}
#tip .tip-row{display:grid;grid-template-columns:12px auto 1fr;gap:8px;align-items:center}
#tip .tip-key{height:2px;border-radius:1px}
#tip strong{font-weight:600} #tip .tip-name{color:var(--baseline)}

/* ---------- recommendations ---------- */
.rec{display:grid;grid-template-columns:36px minmax(0,1fr) 220px;gap:14px;padding:14px 0;border-top:1px solid var(--grid);align-items:start}
.rec:first-child{border-top:0;padding-top:4px}
.rec .rank{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-weight:600;color:#fff;font-size:13px}
.rec .title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.rec .title h3{font-size:16px}
.rec .facts{display:flex;gap:14px;flex-wrap:wrap;color:var(--ink-2);font-size:13px;margin:6px 0}
.rec .facts span b{color:var(--ink);font-weight:600}
.rec ul{margin:4px 0 0;padding-left:18px;font-size:13px;color:var(--ink-2)}
.rec .prob{display:grid;gap:6px}
.rec .prob .p{font-size:26px;font-weight:600;line-height:1}
.rec .prob .p small{font-size:12px;color:var(--ink-2);font-weight:400;margin-left:6px}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.pill-accent{background:var(--accent-soft);color:var(--ink)}
.callout{border-left:3px solid var(--accent);background:var(--surface-2);padding:10px 14px;border-radius:0 8px 8px 0;color:var(--ink-2);font-size:13px}

/* ---------- verification ---------- */
.compare{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.compare .card{margin:0}
.compare .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.compare .big{font-size:22px;font-weight:600;margin:4px 0}
.compare .big-sm{font-size:17px;white-space:nowrap}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.vs .arrow{color:var(--muted)}

/* ---------- planner ---------- */
.planner{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.planner .card{margin:0}
.stock-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--grid)}
.stock-row:last-child{border-bottom:0}
.stock-row .meter{grid-column:1/-1}
.stock-row .name{display:flex;align-items:center;gap:8px;font-weight:600}
.stock-row .nums{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:13px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.hh-list{display:grid;gap:12px}
.hh{border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:grid;gap:10px;background:var(--surface)}
.hh-head{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.hh-head .who{display:flex;align-items:center;gap:10px}
.hh-head .who b{font-size:14px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.basket-bar{display:flex;height:14px}
.basket-bar .seg{min-width:0}
.basket{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px 16px}
.basket-item{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:8px;align-items:center;font-size:13px}
.basket-item .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.basket-item .need{color:var(--muted);font-size:12px;white-space:nowrap}
.qty{display:inline-flex;align-items:center;border:1px solid var(--baseline);border-radius:6px;overflow:hidden}
.qty button{border:0;background:transparent;width:26px;height:26px;cursor:pointer;color:var(--ink-2)}
.qty button:hover{background:var(--surface-2)}
.qty input{width:48px;border:0;text-align:right;background:transparent;font-variant-numeric:tabular-nums;padding:2px 6px}
.summary{display:flex;gap:18px;flex-wrap:wrap;color:var(--ink-2);font-size:13px;margin-top:12px}
.summary b{color:var(--ink)}

/* ---------- login ---------- */
.login{max-width:860px;margin:40px auto}
.personas{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
.personas .card{margin-top:0}
.persona{text-align:left;cursor:pointer;display:grid;gap:8px;align-content:start;align-self:stretch;height:100%}
.persona:hover{border-color:var(--accent)}
.persona .ic{width:40px;height:40px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:20px}

.empty{padding:28px;text-align:center;color:var(--ink-2);border:1px dashed var(--baseline);border-radius:10px}
.footer-note{margin:28px 0 10px;color:var(--muted);font-size:12px;text-align:center}

@media (max-width:860px){
  .two-col,.grid-2,.planner,.compare,.personas{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .rec{grid-template-columns:36px 1fr} .rec .prob{grid-column:2}
  .form-grid{grid-template-columns:1fr} .form-grid .span2{grid-column:span 1}
  .hbar-row{grid-template-columns:90px 1fr 60px} .meter-row{grid-template-columns:90px 1fr 48px auto}
  .appbar{flex-wrap:wrap}
}
</style>
</head>
<body>

<header class="appbar">
  <div class="brand"><span class="logo" aria-hidden="true">✿</span> HarvestLink <span class="pill">mock v0.1</span></div>
  <nav class="roles" aria-label="Role" id="roleNav">
    <button type="button" data-role="farmer">Farmer</button>
    <button type="button" data-role="ngo">NGO</button>
  </nav>
  <div class="spacer"></div>
  <div class="userchip" id="userChip"></div>
  <button class="btn btn-sm" type="button" id="themeBtn">Dark mode</button>
  <button class="btn btn-sm btn-ghost" type="button" id="resetBtn" title="Clear saved demo state">Reset demo</button>
  <a class="btn btn-sm btn-ghost" href="#login">Sign out</a>
</header>

<main id="app" class="container"></main>
<p class="footer-note">Clickable mock. Village, household and farmer names are placeholders. Edit the DATA block in the page source to change the scenario.</p>
<div id="tip" role="tooltip" hidden></div>

<script>

const DATA = {

    { id:'S-106', farmer:'T. Abebe',   village:'hilltop',     recommended:'groundnut',   harvested:'groundnut',   hectares:0.5, qty: 420, pooled: 250, date:'2026-07-28', status:'verified' },
    { id:'S-107', farmer:'N. Moyo',    village:'lakeshore',   recommended:'cassava',     harvested:'cassava',     hectares:1.5, qty:11000,pooled:6000, date:'2026-09-02', status:'verified' },

function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat(Infinity)){
    if (k == null || k === false) continue;
    e.append(k.nodeType ? k : document.createTextNode(String(k)));
  }
  return e;
}

function allSubmissions(){ return [...DATA.submissions, ...state.extraSubmissions]; }

function villageNeeds(vid){
  const v = VILLAGE[vid]; const out = {};
  for (const c of DATA.crops) out[c.id] = Math.round(v.people * v.supportShare * c.perCapita * DATA.cycle.months / 10) * 10;
  return out;
}
function collectedByVillage(subs = allSubmissions(), onlyVerified = true){
  const out = {};
  for (const s of subs){ if (onlyVerified && s.status !== 'verified') continue; (out[s.village] ||= {}); out[s.village][s.harvested] = (out[s.village][s.harvested]||0) + s.pooled; }
  return out;
}

// v0 recommendation: transparent scoring -> softmax probabilities.
function recommend(f){
  const needs = villageNeeds(f.village), have = collectedByVillage()[f.village] || {};
  const rows = DATA.crops.map(c => {
    let score = 0; const why = [], watch = [];
    const soilOk = c.soils.includes(f.soil);
    if (soilOk){ score += 0.6; why.push(`Suits ${f.soil} soil`); } else { score -= 0.4; watch.push(`Prefers ${c.soils.join(' or ')} soil`); }
    const waterOk = c.water === 'low' || c.water === f.rainfall || (c.water === 'medium' && f.rainfall === 'high') || f.irrigation;
    if (waterOk){ score += 0.4; why.push(f.irrigation && c.water !== 'low' ? 'Irrigation covers the water need' : 'Water need fits your rainfall'); }
    else { score -= 0.6; watch.push('Needs more water than your rainfall zone gives'); }
    if (c.seasons.includes(f.season)) score += 0.3; else { score -= 0.7; watch.push(`Not planted in the ${f.season} rains`); }
    const cost = c.costPerHa * f.hectares;
    if (cost <= f.capital){ score += 0.4; why.push(`Inputs about $${Math.round(cost)} fit your budget`); }
    else { const short = (cost - f.capital)/cost; score -= 0.3 + 0.6*short; watch.push(`Inputs about $${Math.round(cost)} exceed your budget by $${Math.round(cost - f.capital)}`); }
    const need = needs[c.id] || 0, got = have[c.id] || 0; const gap = need ? clamp((need-got)/need, 0, 1) : 0;
    score += 0.6 * gap;
    if (gap > 0.5) why.push(`High community demand in ${VILLAGE[f.village].name}: ${pct(gap)} of need unmet`);
    else if (gap < 0.15) watch.push('Community need already largely covered');
    if (f.lastCrop === c.id){ score -= 0.25; watch.push('Same crop as last season, rotation advised'); }
    else if (c.family === 'legume' && CROP[f.lastCrop]?.family === 'cereal'){ score += 0.15; why.push('Good rotation after a cereal'); }
    if ((f.preferred||[]).includes(c.id)){ score += 0.2; why.push('You marked this as a preferred crop'); }
    const expectedYield = Math.round(c.yieldPerHa * f.hectares * (waterOk?1:0.6) * (soilOk?1:0.8));
    return { crop:c, score, why, watch, expectedYield, cost, gap, harvestDays:c.days };
  });
  const T = 0.9; const exps = rows.map(r => Math.exp(r.score/T)); const z = sum(exps);
  rows.forEach((r,i) => r.p = exps[i]/z);
  return rows.sort((a,b) => b.p - a.p);
}

function verify(plan, hv){
  const match = plan.crop === hv.crop;
  const exp = plan.expectedYield; const variance = (hv.qty - exp)/exp;
  const expectedDate = addDays(plan.plantedOn, CROP[plan.crop].days);
  const days = daysBetween(expectedDate, hv.date);
  let st;
  if (!match) st = { k:'serious', icon:'▲', label:'Different crop harvested' };
  else if (Math.abs(variance) <= 0.25) st = { k:'good', icon:'✓', label:'Matches forecast' };
  else if (variance < 0) st = { k:'warning', icon:'!', label:'Below forecast' };
  else st = { k:'good', icon:'✓', label:'Above forecast' };
  return { match, exp, variance, expectedDate, days, st };
}

function coverageStatus(c){
  if (c >= 0.9) return { k:'good', icon:'✓', label:'Covered' };
  if (c >= 0.7) return { k:'warning', icon:'!', label:'Near target' };
  if (c >= 0.4) return { k:'serious', icon:'▲', label:'Shortfall' };
  return { k:'critical', icon:'✕', label:'Critical gap' };
}

// Deterministic placeholder households per village (a subset, for the planner).
function households(vid){
  let seed = [...vid].reduce((a,ch)=>a+ch.charCodeAt(0), 7);
  const rnd = () => (seed = (seed*9301+49297) % 233280) / 233280;
  const v = VILLAGE[vid]; const n = 6; const out = [];
  for (let i=0;i<n;i++){
    const members = 2 + Math.floor(rnd()*7);
    const tags = DATA.vulnerabilityTags.filter(() => rnd() < 0.38);
    const need = {}; for (const c of DATA.crops) need[c.id] = Math.round(members * c.perCapita * DATA.cycle.months * (0.8 + rnd()*0.4));
    out.push({ id:`${vid}-${String(i+1).padStart(2,'0')}`, label:`Household ${v.name.slice(0,2).toUpperCase()}-${String(i+1).padStart(2,'0')}`, village:vid, members, tags, need, priority: 1 + tags.length*0.5 + members*0.1 });
  }
  return out;
}

/* ---------- allocation ---------- */
function allocOf(hhId){ return state.ngo.alloc[hhId] ||= {}; }
function allocatedTotal(cropId){ return sum(Object.values(state.ngo.alloc).map(a => a[cropId]||0)); }
function stock(){ // verified pooled across *all* villages minus allocated everywhere
  const got = {}; for (const s of allSubmissions()) if (s.status==='verified') got[s.harvested] = (got[s.harvested]||0) + s.pooled;
  return DATA.crops.map(c => ({ crop:c, available: got[c.id]||0, allocated: allocatedTotal(c.id), remaining: (got[c.id]||0) - allocatedTotal(c.id) }));
}
function autoAllocate(hhs){
  for (const c of DATA.crops){
    const remaining = stock().find(s=>s.crop.id===c.id).remaining + sum(hhs.map(hh => allocOf(hh.id)[c.id]||0));
    const totalNeed = sum(hhs.map(hh => hh.need[c.id]));
    if (remaining >= totalNeed){ hhs.forEach(hh => allocOf(hh.id)[c.id] = hh.need[c.id]); continue; }
    const weights = hhs.map(hh => hh.need[c.id] * hh.priority); const w = sum(weights) || 1;
    let left = remaining;
    hhs.forEach((hh,i) => { const q = Math.min(hh.need[c.id], Math.floor(remaining * weights[i]/w)); allocOf(hh.id)[c.id] = q; left -= q; });
    for (const hh of hhs){ if (left<=0) break; const room = hh.need[c.id] - allocOf(hh.id)[c.id]; const add = Math.min(room,left); allocOf(hh.id)[c.id] += add; left -= add; }
  }
  save();
}

      {label:'Farmer',render:s=>h('span',{}, h('b',{},s.farmer), h('div',{class:'small muted'},s.id))},
      {label:'Village',render:s=>VILLAGE[s.village].name},
      {label:'Recommended',render:s=>cropCell(s.recommended)},
      {label:'Harvested',render:s=>cropCell(s.harvested)},
      {label:'Match',render:s=>badge(s.recommended===s.harvested ? {k:'good',icon:'✓',label:'Match'} : {k:'serious',icon:'▲',label:'Different'})},
      {label:'Harvest (kg)',num:true,render:s=>fmt(s.qty)},
      {label:'kg / ha',num:true,render:s=>fmt(s.qty/s.hectares)},
      {label:'Pooled (kg)',num:true,render:s=>fmt(s.pooled)},
      {label:'Date',render:s=>fmtDate(s.date)},
      {label:'Status',render:s=>badge(s.status==='verified' ? {k:'good',icon:'✓',label:'Verified'} : {k:'neutral',icon:'…',label:'Pending'})},
      {label:'',render:verifyBtn}], subs));
  return ngoShell('submissions', content);
}
function downloadCsv(name, rows){
  const esc = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const blob = new Blob([rows.map(r => r.map(esc).join(',')).join('\n')], {type:'text/csv'});
  const a = h('a',{href:URL.createObjectURL(blob),download:name}); document.body.append(a); a.click(); a.remove();
}

/* ---------- NGO distribution planner (the cart) ---------- */
function viewPlanner(){
  const vid = state.ngo.plannerVillage; const v = VILLAGE[vid]; const hhs = households(vid);
  if (state._autoAllocate){ delete state._autoAllocate; autoAllocate(hhs); }
  const st = stock();
  const series = cropSeries();
  const stockCard = h('div',{class:'card'}, h('h3',{},'Stock available'), h('p',{class:'sub small',style:'margin:4px 0 6px'},'Verified pooled harvest across all villages, minus what is already allocated.'),
    st.map(s => { const row = h('div',{class:'stock-row'}, h('div',{class:'name'}, h('span',{class:'swatch',style:`background:${cropColor(s.crop.id)}`}), s.crop.name), h('div',{class:'nums'}, `${fmt(s.remaining)} kg left`), meter(s.available ? s.allocated/s.available : 0, `${s.crop.name}: ${fmt(s.allocated)} of ${fmt(s.available)} kg allocated`), h('div',{class:'small muted'}, `${fmt(s.allocated)} allocated of ${fmt(s.available)}`)); attachTip(row.children[2], () => ({ title:s.crop.name, rows:[{color:'var(--meter-fill)',value:`${fmt(s.allocated)} kg`,name:'allocated'},{color:'var(--meter-track)',value:`${fmt(s.available)} kg`,name:'available'}] })); return row; }));

  const villageSel = h('select',{class:'input',style:'width:auto',onchange:ev=>{ state.ngo.plannerVillage = ev.target.value; save(); render(); }}, DATA.villages.map(x => h('option',{value:x.id,selected:x.id===vid}, `${x.name} · ${x.district}`)));
  const toolbar = h('div',{class:'toolbar'}, h('div',{class:'field',style:'flex-direction:row;align-items:center;gap:8px'}, h('label',{},'Village'), villageSel),
    h('button',{class:'btn btn-primary',type:'button',onclick:()=>{ autoAllocate(hhs); render(); }},'Auto-allocate by need'),
    h('button',{class:'btn',type:'button',onclick:()=>{ hhs.forEach(hh => delete state.ngo.alloc[hh.id]); save(); render(); }},'Clear village'),
    h('button',{class:'btn',type:'button',onclick:()=>downloadCsv(`distribution-${vid}.csv`, [['household','members','tags',...DATA.crops.map(c=>c.name+'_kg')], ...hhs.map(hh=>[hh.label,hh.members,hh.tags.join('; '),...DATA.crops.map(c=>allocOf(hh.id)[c.id]||0)])])},'Export plan'),
    h('span',{class:'help'}, `Showing ${hhs.length} of ${v.households} households (demo subset).`));

  const hhCards = hhs.sort((a,b)=>b.priority-a.priority).map(hh => {
    const a = allocOf(hh.id); const needT = sum(Object.values(hh.need)); const allocT = sum(DATA.crops.map(c=>Math.min(a[c.id]||0, hh.need[c.id])));
    const cov = allocT/needT;
    const bar = h('div',{class:'basket-bar',role:'img','aria-label':`${hh.label}: ${pct(cov)} of need allocated`});
    for (const c of DATA.crops){ const q = Math.min(a[c.id]||0, hh.need[c.id]); if (!q) continue; const seg = h('div',{class:'seg',style:`flex:0 1 ${q/needT*100}%;background:${cropColor(c.id)}`,tabindex:0}); attachTip(seg, () => ({ title:hh.label, rows:[{color:cropColor(c.id),value:`${q} kg`,name:`${c.name} allocated`},{color:'transparent',value:`${hh.need[c.id]} kg`,name:'needed'}] })); bar.append(seg); }
    const unmet = needT - allocT; if (unmet>0){ const seg = h('div',{class:'seg',style:`flex:0 1 ${unmet/needT*100}%;background:var(--grid)`,tabindex:0}); attachTip(seg, () => ({ title:hh.label, rows:[{color:'var(--grid)',value:`${unmet} kg`,name:'unmet need'}] })); bar.append(seg); }
    const items = DATA.crops.map(c => {
      const input = h('input',{type:'number',min:'0',value:a[c.id]||0,'aria-label':`${c.name} for ${hh.label}, kg`});
      const setQ = q => { const s = st.find(x=>x.crop.id===c.id); const maxQ = s.remaining + (a[c.id]||0); a[c.id] = clamp(Math.round(q)||0, 0, maxQ); save(); render(); };
      input.addEventListener('change', () => setQ(+input.value));
      return h('div',{class:'basket-item'}, h('span',{class:'swatch',style:`background:${cropColor(c.id)};margin:0`}), h('span',{class:'name'}, c.name), h('span',{class:'need'}, `needs ${hh.need[c.id]} kg`),
        h('span',{class:'qty'}, h('button',{type:'button','aria-label':`less ${c.name}`,onclick:()=>setQ((a[c.id]||0)-5)},'−'), input, h('button',{type:'button','aria-label':`more ${c.name}`,onclick:()=>setQ((a[c.id]||0)+5)},'+')));
    });
    return h('div',{class:'hh'},
      h('div',{class:'hh-head'}, h('div',{class:'who'}, h('span',{class:'avatar','aria-hidden':'true'}, hh.label.slice(-2)), h('div',{}, h('b',{},hh.label), h('div',{class:'small muted'}, `${hh.members} members · priority ${hh.priority.toFixed(1)}`))),
        h('div',{style:'display:flex;align-items:center;gap:10px'}, h('span',{class:'small sub num'}, `${allocT} / ${needT} kg`), badge(coverageStatus(cov)))),
      hh.tags.length ? h('div',{class:'tags'}, hh.tags.map(t => h('span',{class:'tag'},t))) : h('div',{class:'tags'}, h('span',{class:'tag'},'No vulnerability flags')),
      bar,
      h('div',{class:'basket'}, items));
  });
  const totals = (() => { const n = sum(hhs.map(hh=>sum(Object.values(hh.need)))); const a = sum(hhs.map(hh=>sum(DATA.crops.map(c=>Math.min(allocOf(hh.id)[c.id]||0, hh.need[c.id]))))); const full = hhs.filter(hh => DATA.crops.every(c => (allocOf(hh.id)[c.id]||0) >= hh.need[c.id])).length; const none = hhs.filter(hh => sum(Object.values(allocOf(hh.id)))===0).length; return {n,a,full,none}; })();
  const right = h('div',{class:'card'}, h('div',{class:'card-head'}, h('div',{}, h('h3',{}, `Baskets · ${v.name}`), h('p',{class:'sub small'},'Each bar shows the household’s need; coloured segments are allocated crops, grey is still unmet.'))), toolbar,
    legend([...series, {name:'Unmet need', color:'var(--grid)'}]),
    h('div',{class:'hh-list'}, hhCards),
    h('div',{class:'summary'}, h('span',{}, 'Allocated ', h('b',{}, `${fmt(totals.a)} kg`), ` of ${fmt(totals.n)} kg needed`), h('span',{}, h('b',{},totals.full), ' households fully covered'), h('span',{}, h('b',{},hhs.length-totals.full-totals.none), ' partially'), h('span',{}, h('b',{},totals.none), ' nothing yet')));
  return ngoShell('planner', h('div',{class:'planner'}, stockCard, right));
}

/* =====================================================================
   Router
   ===================================================================== */
function go(hash){ if (location.hash === hash) render(); else location.hash = hash; }
function render(){
  const parts = (location.hash || '#login').slice(1).split('/');
  const [area, page] = parts;
  let view;
  if (area === 'farmer'){ state.role = 'farmer'; view = { profile:viewProfile, recommend:viewRecommend, harvest:viewHarvest, verify:viewVerify }[page||'profile'] || viewProfile; }
  else if (area === 'ngo'){ state.role = 'ngo'; view = { overview:viewOverview, submissions:viewSubmissions, planner:viewPlanner }[page||'overview'] || viewOverview; }
  else { view = viewLogin; }
  tip.hidden = true;
  app.replaceChildren(view());
  for (const b of document.querySelectorAll('#roleNav button')){ b.setAttribute('aria-current', area!=='login' && b.dataset.role===state.role ? 'true' : 'false'); b.onclick = () => go(b.dataset.role==='farmer' ? '#farmer/profile' : '#ngo/overview'); }
  const chip = document.getElementById('userChip'); chip.replaceChildren();
  if (area === 'farmer') chip.append(h('span',{class:'avatar','aria-hidden':'true'}, state.farmer.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()), `${state.farmer.name} · ${VILLAGE[state.farmer.village].name}`);
  else if (area === 'ngo') chip.append(h('span',{class:'avatar','aria-hidden':'true'},'NG'), 'Programme coordinator');
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', render);
render();
</script>
