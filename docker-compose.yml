# Local full stack: Postgres + API + web.  `docker compose up --build`, then open http://localhost:3000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: viamensa
      POSTGRES_PASSWORD: viamensa
      POSTGRES_DB: viamensa
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viamensa"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      VIAMENSA_DATABASE_URL: postgresql+psycopg://viamensa:viamensa@db:5432/viamensa
      VIAMENSA_JWT_SECRET: ${VIAMENSA_JWT_SECRET:-local-compose-secret-change-me-0123456789}
      VIAMENSA_CORS_ORIGINS: '["http://localhost:3000"]'
      VIAMENSA_DEMO_USER_PASSWORD: ${VIAMENSA_DEMO_USER_PASSWORD:-viamensa-demo}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      VIAMENSA_API_URL: http://api:8000
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata:
